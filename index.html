
<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<title>Потужний Симулятор</title>
<style>
*{box-sizing:border-box}
html,body{
 margin:0;
 min-height:100%;
 background:#05030d;
 color:white;
 font-family:Arial,sans-serif;
}
button{font-family:inherit;cursor:pointer;touch-action:manipulation}
[hidden]{display:none!important}

/* ГОЛОВНЕ МЕНЮ */
#menu{
 min-height:100dvh;
 display:flex;
 justify-content:center;
 align-items:center;
 background:linear-gradient(180deg,#a8e5ff 0%,#e0f6ff 55%,#fff 100%);
}
.menu-image{
 position:relative;
 width:min(100vw,66.6667dvh);
 height:min(100dvh,150vw);
 background:url("menu.png") center/100% 100% no-repeat;
}
.hot{
 position:absolute;
 z-index:5;
 border:0;
 background:transparent;
 color:transparent;
}
.hot:active{background:#ffffff22}
.hot:focus-visible{outline:2px solid #fff}
.profile{
 left:3%;top:1.5%;width:14%;height:7.5%;
}
.clicker{
 left:4%;top:10%;width:45%;height:15.5%;
}
.roll{
 left:51%;top:10%;width:45%;height:15.5%;
}
.factory{
 left:4%;top:26%;width:45%;height:15.5%;
}
.records{
 left:51%;top:26%;width:45%;height:15.5%;
}
.settings{
 left:3%;top:89%;width:14%;height:9%;
}

/* ОДНАКОВИЙ БАЛАНС У МЕНЮ ТА КЛІКЕРІ */
.balance{
 display:flex;
 align-items:center;
 justify-content:center;
 gap:9px;
 min-height:46px;
 padding:6px 13px;
 border:2px solid #e3e1eb;
 border-radius:17px;
 background:#08080c;
 color:#fff;
 font-size:25px;
 font-weight:900;
 font-variant-numeric:tabular-nums;
 white-space:nowrap;
 box-shadow:0 3px 8px #0004;
}
.coin{
 display:inline-grid;
 place-items:center;
 flex-shrink:0;
 width:33px;
 height:33px;
 border:3px solid #ffe68a;
 border-radius:50%;
 background:linear-gradient(#ffdf47,#f1a000);
 color:#8a5000;
 font-size:20px;
 font-weight:900;
}
.menu-balance-cover{
 position:absolute;
 z-index:8;
 right:1%;
 top:1%;
 width:38%;
 height:8.5%;
 display:flex;
 align-items:center;
 justify-content:center;
 background:linear-gradient(180deg,#afe8ff,#bcecff);
 border-radius:13px;
}
.menu-balance-cover .balance{
 max-width:100%;
 min-width:82%;
 font-size:clamp(19px,5vw,27px);
}
.balance-number{
 overflow:hidden;
 text-overflow:ellipsis;
}

/* КЛІКЕР */
#game{
 min-height:100dvh;
 display:flex;
 justify-content:center;
 background:radial-gradient(
  ellipse at 0% 50%,
  #5900c7 0%,
  #240050 46%,
  #050408 100%
 );
}
.game-inner{
 width:min(100%,470px);
 min-height:100dvh;
 padding:20px 15px 28px;
 display:flex;
 flex-direction:column;
 align-items:center;
}
.top{
 width:100%;
 display:flex;
 justify-content:space-between;
 align-items:center;
 gap:8px;
}
.back{
 min-height:46px;
 padding:10px 14px;
 background:#08080c;
 color:#fff;
 border:2px solid #e3e1eb;
 border-radius:17px;
 font-size:17px;
 font-weight:900;
}
.level{
 margin:clamp(30px,7vh,75px) 0 15px;
 font-size:clamp(32px,9vw,48px);
 font-weight:900;
 text-shadow:0 3px 3px #000;
}
.level b{color:#a05aff}
.barrow{
 width:100%;
 display:flex;
 align-items:center;
 gap:8px;
}
.track{
 flex:1;
 height:30px;
 overflow:hidden;
 border:4px solid #080712;
 border-radius:12px;
 background:#080c18;
}
.fill{
 width:100%;
 height:100%;
 background:
 repeating-linear-gradient(
  90deg,
  transparent 0,
  transparent calc(5% - 2px),
  #0875c4 calc(5% - 2px),
  #0875c4 5%
 ),
 linear-gradient(#38ddff,#0088ef);
 transition:width .15s;
}
.energy{
 font-size:14px;
 font-weight:900;
 white-space:nowrap;
}

/* ВЕЛИКИЙ ПЕС ПАТРОН */
.dog{
 display:block;
 position:relative;
 width:min(90vw,400px);
 aspect-ratio:1;
 flex-shrink:0;
 margin:clamp(25px,5vh,55px) 0 22px;
 padding:0;
 overflow:hidden;
 border:0;
 border-radius:50%;
 background:#0d061c;
}
.dog img{
 display:block;
 width:100%;
 height:100%;
 object-fit:contain;
 object-position:center;
 pointer-events:none;
}
.dog:active{transform:scale(.97)}

/* ПОКРАЩЕННЯ */
.upgrade-wrap{
 width:min(80%,310px);
 margin:0 auto 12px;
 display:flex;
 flex-direction:column;
 align-items:center;
}
.upgrade{
 width:100%;
 min-height:120px;
 padding:12px 10px 26px;
 border:2px solid #aaa7b4;
 border-radius:24px;
 background:linear-gradient(#17121b,#08070b);
 color:#fff;
 font-size:22px;
 font-weight:900;
 line-height:1.15;
}
.upgrade-icon{
 display:block;
 font-size:37px;
 line-height:1.1;
}
.price-box{
 display:flex;
 align-items:center;
 justify-content:center;
 gap:10px;
 position:relative;
 margin-top:-18px;
 min-width:170px;
 padding:7px 20px;
 border:2px solid #aaa7b4;
 border-radius:17px;
 background:#09090d;
 font-size:23px;
 font-weight:900;
 pointer-events:none;
}
.upgrade:disabled{opacity:.65}
.message{
 min-height:28px;
 margin-top:8px;
 text-align:center;
 color:#e8dff2;
 font-size:14px;
}

/* ПРОФІЛЬ */
#profileScreen{
 position:fixed;
 inset:0;
 z-index:20;
 overflow-y:auto;
 background:radial-gradient(circle at 15% 15%,#522a8c,#1d1238 42%,#070610);
 padding:24px 18px;
}
.profile-wrap{
 max-width:440px;
 margin:auto;
 display:flex;
 flex-direction:column;
 gap:20px;
}
.profile-top{
 display:flex;
 align-items:center;
 gap:18px;
}
.profile-top h2{margin:0;font-size:25px}
.profile-back,.google-login,.logout{
 padding:12px 17px;
 color:#fff;
 background:#231944;
 border:1px solid #a99acc;
 border-radius:14px;
 font-weight:700;
}
.profile-card{
 padding:22px 18px;
 border:1px solid #8c77bd;
 border-radius:20px;
 background:#170f2dcc;
 text-align:center;
}
.profile-avatar{
 display:grid;
 place-items:center;
 width:80px;
 height:80px;
 margin:0 auto 14px;
 border-radius:50%;
 background:#4e347e;
 font-size:40px;
}
.profile-card h3{margin:8px 0}
.profile-card p{
 line-height:1.5;
 color:#d5cbea;
}
.google-login{
 width:100%;
 margin-top:8px;
 background:#fff;
 color:#1f1f1f;
 border:0;
 font-size:16px;
}
.logout{
 margin-top:12px;
 background:#382249;
}
.profile-status{
 min-height:22px;
 font-size:13px;
 color:#d5cbea;
}
.profile-stats{
 display:flex;
 gap:12px;
}
.profile-stat{
 flex:1;
 padding:16px 8px;
 border-radius:15px;
 background:#21163d;
 text-align:center;
}
.profile-stat strong{
 display:block;
 font-size:24px;
}
.toast{
 position:fixed;
 z-index:50;
 bottom:24px;
 left:50%;
 transform:translateX(-50%);
 min-width:180px;
 padding:12px 16px;
 border:1px solid #c2b5d7;
 border-radius:14px;
 background:#171222;
 text-align:center;
}
</style>
</head>
<body>

<!-- ГОЛОВНЕ МЕНЮ -->
<section id="menu">
<div class="menu-image">

<button class="hot profile" id="profileButton" aria-label="Акаунт"></button>

<div class="menu-balance-cover">
<div class="balance">
<span class="coin">♛</span>
<span class="balance-number" id="menuCoins">0</span>
</div>
</div>

<button class="hot clicker" id="openClicker" aria-label="Клікер"></button>
<button class="hot roll" data-soon="Ролл" aria-label="Ролл"></button>
<button class="hot factory" data-soon="Фабрика" aria-label="Фабрика"></button>
<button class="hot records" data-soon="Рекорди" aria-label="Рекорди"></button>
<button class="hot settings" data-soon="Налаштування" aria-label="Налаштування"></button>

</div>
</section>

<!-- КЛІКЕР -->
<section id="game" hidden>
<div class="game-inner">

<div class="top">
<button class="back" id="back">❮ Назад</button>
<div class="balance">
<span class="coin">♛</span>
<span class="balance-number" id="coins">0</span>
</div>
</div>

<h1 class="level">РІВЕНЬ <b id="level">1</b></h1>

<div class="barrow">
<div class="track">
<div class="fill" id="fill"></div>
</div>
<span class="energy" id="energy">100/100</span>
</div>

<button class="dog" id="dog" aria-label="Натиснути на Пса Патрона">
<img src="patron.png" alt="Пес Патрон">
</button>

<div class="upgrade-wrap">
<button class="upgrade" id="upgrade">
<span class="upgrade-icon">⬆</span>
ПОКРАЩИТИ<br>РІВЕНЬ
</button>
<div class="price-box">
<span class="coin">♛</span>
<span id="price">200</span>
</div>
</div>

<div class="message" id="msg">
Натискай на Патрона, щоб збирати монети!
</div>

</div>
</section>

<!-- ПРОФІЛЬ -->
<section id="profileScreen" hidden>
<div class="profile-wrap">

<div class="profile-top">
<button class="profile-back" id="profileBack">❮ Назад</button>
<h2>ПРОФІЛЬ</h2>
</div>

<div class="profile-card">
<div class="profile-avatar">👤</div>
<h3 id="profileName">Гість</h3>
<p id="profileDescription">
Увійди через Google, щоб зберігати прогрес у хмарі.
</p>
<button class="google-login" id="googleLogin">
🌐 Вибрати Google-акаунт
</button>
<button class="logout" id="googleLogout" hidden>
Вийти з акаунта
</button>
<p class="profile-status" id="profileStatus">
Підключення до Firebase…
</p>
</div>

<div class="profile-stats">
<div class="profile-stat">
🪙 Монети
<strong id="profileCoins">0</strong>
</div>
<div class="profile-stat">
⭐ Рівень
<strong id="profileLevel">1</strong>
</div>
</div>

</div>
</section>

<div class="toast" id="toast" hidden></div>

<!-- ЛОГІКА ГРИ -->
<script>
(()=>{
"use strict";

const el=id=>document.getElementById(id);
const menu=el("menu");
const game=el("game");
const profile=el("profileScreen");
const key="potuzhnyi_clicker_v4";

let state={
 coins:0,
 energy:100,
 level:1,
 last:Date.now()
};

let carry=0;
let toastTimer;
let cloudLoading=false;

try{
 const old=JSON.parse(localStorage.getItem(key));
 if(old&&
 Number.isFinite(old.coins)&&
 Number.isFinite(old.level)&&
 Number.isFinite(old.energy)){
  state={...state,...old};
 }
}catch(e){}

state.coins=Math.max(0,Math.floor(state.coins));
state.level=Math.max(1,Math.floor(state.level));
state.energy=Math.max(0,Math.min(100,state.energy));

function toast(message){
 const box=el("toast");
 box.textContent=message;
 box.hidden=false;
 clearTimeout(toastTimer);
 toastTimer=setTimeout(()=>{
  box.hidden=true;
 },2200);
}

function price(){
 return state.level*200;
}

function save(){
 try{
  localStorage.setItem(key,JSON.stringify(state));
 }catch(e){}

 if(!cloudLoading){
  window.dispatchEvent(new CustomEvent("game-save",{
   detail:{...state}
  }));
 }
}

function draw(){
 el("coins").textContent=state.coins;
 el("menuCoins").textContent=state.coins;
 el("level").textContent=state.level;
 el("energy").textContent=state.energy+"/100";
 el("fill").style.width=state.energy+"%";
 el("price").textContent=price();
 el("upgrade").disabled=state.coins<price();
 el("profileCoins").textContent=state.coins;
 el("profileLevel").textContent=state.level;
}

function tick(){
 const now=Date.now();
 const seconds=Math.min(
  86400,
  Math.max(0,(now-state.last)/1000)
 );

 state.last=now;
 carry+=seconds;
 let changed=false;

 while(state.energy<100){
  const interval=state.energy<10?2:1;
  if(carry<interval)break;
  carry-=interval;
  state.energy=Math.min(100,state.energy+2);
  changed=true;
 }

 if(state.energy===100)carry=0;
 if(changed){
  save();
  draw();
 }
}

el("openClicker").onclick=()=>{
 menu.hidden=true;
 game.hidden=false;
 tick();
 draw();
};

el("back").onclick=()=>{
 game.hidden=true;
 menu.hidden=false;
 save();
};

el("profileButton").onclick=()=>{
 menu.hidden=true;
 game.hidden=true;
 profile.hidden=false;
 draw();
 window.dispatchEvent(new Event("request-google-login"));
};

el("profileBack").onclick=()=>{
 profile.hidden=true;
 menu.hidden=false;
};

document.querySelectorAll("[data-soon]").forEach(button=>{
 button.onclick=()=>{
  toast(button.dataset.soon+" — скоро буде!");
 };
});

el("dog").onclick=()=>{
 tick();

 if(state.energy<2){
  toast("Енергія закінчилась!");
  return;
 }

 state.energy-=2;
 state.coins+=state.level;
 state.last=Date.now();

 save();
 draw();

 el("msg").textContent="+"+state.level+" монет 🪙";
};

el("upgrade").onclick=()=>{
 const cost=price();

 if(state.coins<cost)return;

 state.coins-=cost;
 state.level++;

 save();
 draw();

 el("msg").textContent=
  "Новий рівень! +"+state.level+" монети за клік";
};

window.addEventListener("cloud-load",event=>{
 const d=event.detail;
 if(!d)return;

 cloudLoading=true;

 state.coins=Math.max(0,Math.floor(Number(d.coins)||0));
 state.level=Math.max(1,Math.floor(Number(d.level)||1));
 state.energy=Math.max(
  0,
  Math.min(100,Number.isFinite(Number(d.energy))
   ?Math.floor(Number(d.energy)):100)
 );
 state.last=Number(d.last)||Date.now();

 carry=0;
 save();
 tick();
 draw();

 cloudLoading=false;
});

window.addEventListener("pagehide",save);

tick();
draw();
setInterval(tick,250);

})();
</script>

<!-- FIREBASE І GOOGLE -->
<script type="module">
import {initializeApp}
from "https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js";

import {
 getAuth,
 GoogleAuthProvider,
 signInWithPopup,
 signOut,
 onAuthStateChanged
}
from "https://www.gstatic.com/firebasejs/11.10.0/firebase-auth.js";

import {
 getFirestore,
 doc,
 getDoc,
 setDoc
}
from "https://www.gstatic.com/firebasejs/11.10.0/firebase-firestore.js";

const firebaseConfig={
 apiKey:"AIzaSyAvWb2Av6XYUWN_FyVcFZjY7qCIf-EQBdg",
 authDomain:"potuzhnyi-simulator.firebaseapp.com",
 projectId:"potuzhnyi-simulator",
 storageBucket:"potuzhnyi-simulator.firebasestorage.app",
 messagingSenderId:"22853697098",
 appId:"1:22853697098:web:a4898d06f77afb9d66b0b3"
};

const $=id=>document.getElementById(id);
const status=message=>{
 $("profileStatus").textContent=message;
};

const saveKey="potuzhnyi_clicker_v4";

let auth;
let db;
let user=null;
let ready=false;
let pending=null;
let timer=null;
let session=0;
let loginBusy=false;

function snapshot(){
 try{
  return JSON.parse(localStorage.getItem(saveKey)||"{}");
 }catch(e){
  return {};
 }
}

function valid(d){
 return d&&
 Number.isFinite(d.coins)&&
 Number.isFinite(d.level)&&
 Number.isFinite(d.energy);
}

async function flush(){
 if(!user||!ready||!pending)return;

 const uid=user.uid;
 const data=pending;
 pending=null;

 try{
  await setDoc(doc(db,"players",uid),data,{merge:true});
  if(user?.uid===uid){
   status("☁️ Прогрес збережено");
  }
 }catch(err){
  if(user?.uid===uid){
   pending=data;
   status("Помилка збереження: "+(err.code||err.message));
  }
 }
}

window.addEventListener("game-save",event=>{
 if(!user||!ready)return;

 pending={
  ...event.detail,
  updatedAt:Date.now()
 };

 clearTimeout(timer);
 timer=setTimeout(flush,900);
});

document.addEventListener("visibilitychange",()=>{
 if(document.visibilityState==="hidden"){
  clearTimeout(timer);
  flush();
 }
});

try{
 const app=initializeApp(firebaseConfig);
 auth=getAuth(app);
 db=getFirestore(app);

 async function googleLogin(){
  if(loginBusy)return;
  loginBusy=true;
  $("googleLogin").disabled=true;
  status("Відкриваємо Google…");

  try{
   const provider=new GoogleAuthProvider();
   provider.setCustomParameters({
    prompt:"select_account"
   });

   await signInWithPopup(auth,provider);
  }catch(err){
   status("Помилка входу: "+(err.code||err.message));
  }finally{
   loginBusy=false;
   $("googleLogin").disabled=false;
  }
 }

 $("googleLogin").onclick=googleLogin;

 window.addEventListener("request-google-login",()=>{
  if(!auth.currentUser){
   googleLogin();
  }
 });

 $("googleLogout").onclick=async()=>{
  await flush();
  await signOut(auth);
 };

 onAuthStateChanged(auth,async current=>{
  const mySession=++session;

  user=current;
  ready=false;
  pending=null;
  clearTimeout(timer);

  $("googleLogin").hidden=!!current;
  $("googleLogout").hidden=!current;

  $("profileName").textContent=current
   ?(current.displayName||"Гравець")
   :"Гість";

  $("profileDescription").textContent=current
   ?"Твій прогрес прив’язаний до Google-акаунта."
   :"Увійди через Google, щоб зберігати прогрес у хмарі.";

  if(!current){
   status("Гостьовий режим — прогрес лише на пристрої");
   return;
  }

  status("☁️ Завантажуємо прогрес…");

  try{
   const ref=doc(db,"players",current.uid);
   const result=await getDoc(ref);

   if(mySession!==session)return;

   if(result.exists()&&valid(result.data())){
    window.dispatchEvent(new CustomEvent("cloud-load",{
     detail:result.data()
    }));
   }else{
    const local=snapshot();
    const previous=localStorage.getItem("potuzhnyi_last_account");

    const data=(!previous&&valid(local))
     ?local
     :{
       coins:0,
       level:1,
       energy:100,
       last:Date.now()
      };

    window.dispatchEvent(new CustomEvent("cloud-load",{
     detail:data
    }));

    await setDoc(ref,{
     coins:data.coins,
     level:data.level,
     energy:data.energy,
     last:data.last,
     updatedAt:Date.now()
    });
   }

   if(mySession!==session)return;

   localStorage.setItem("potuzhnyi_last_account",current.uid);
   ready=true;
   status("☁️ Прогрес синхронізовано");

  }catch(err){
   if(mySession===session){
    status("Помилка завантаження: "+(err.code||err.message));
   }
  }
 });

}catch(err){
 status("Firebase не запустився: "+(err.message||err));
}
</script>

</body>
</html>
