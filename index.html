<!-- ЛОГІКА КЛІКЕРА -->
<script>
(()=>{
'use strict';

const $=id=>document.getElementById(id);
const key='potuzhnyi_clicker_v4';

let state={
 coins:0,
 level:1,
 energy:100,
 last:Date.now()
};
let energyCarry=0;
let toastTimer;
let loadingCloud=false;

try{
 const old=JSON.parse(localStorage.getItem(key));
 if(old&&
  Number.isFinite(old.coins)&&
  Number.isFinite(old.level)&&
  Number.isFinite(old.energy)){
  state={...state,...old};
 }
}catch(e){}

function normalize(){
 state.coins=Math.max(0,Math.floor(Number(state.coins)||0));
 state.level=Math.max(1,Math.floor(Number(state.level)||1));
 state.energy=Math.max(0,Math.min(100,Math.floor(Number(state.energy)||0)));
 state.last=Number(state.last)||Date.now();
}
normalize();

function upgradeCost(){
 return state.level*200;
}

function draw(){
 $('coins').textContent=state.coins;
 $('menuCoins').textContent=state.coins;
 $('profileCoins').textContent=state.coins;
 $('profileLevel').textContent=state.level;
 $('level').textContent=state.level;
 $('energyText').textContent=state.energy+'/100';
 $('energyFill').style.width=state.energy+'%';
 $('upgradePrice').textContent=upgradeCost();
 $('upgrade').disabled=state.coins<upgradeCost();
}

function save(){
 try{
  localStorage.setItem(key,JSON.stringify(state));
 }catch(e){}
 if(!loadingCloud){
  window.dispatchEvent(new CustomEvent('game-save',{
   detail:{...state}
  }));
 }
}

function toast(message){
 const box=$('toast');
 box.textContent=message;
 box.hidden=false;
 clearTimeout(toastTimer);
 toastTimer=setTimeout(()=>box.hidden=true,2200);
}

function regenerate(){
 const now=Date.now();
 const elapsed=Math.max(0,Math.min(86400,(now-state.last)/1000));
 state.last=now;
 energyCarry+=elapsed;
 let changed=false;

 while(state.energy<100){
  const interval=state.energy<10?2:1;
  if(energyCarry<interval)break;
  energyCarry-=interval;
  state.energy=Math.min(100,state.energy+2);
  changed=true;
 }
 if(state.energy>=100)energyCarry=0;
 if(changed){
  save();
  draw();
 }
}

function showMenu(){
 $('menu').hidden=false;
 $('game').hidden=true;
 $('profileScreen').hidden=true;
 draw();
}

$('openClicker').onclick=()=>{
 $('menu').hidden=true;
 $('game').hidden=false;
 regenerate();
 draw();
};

$('back').onclick=()=>{
 save();
 showMenu();
};

$('profileButton').onclick=()=>{
 $('menu').hidden=true;
 $('game').hidden=true;
 $('profileScreen').hidden=false;
 draw();
};

$('profileBack').onclick=showMenu;

document.querySelectorAll('[data-soon]').forEach(b=>{
 b.onclick=()=>toast(b.dataset.soon+' — скоро буде!');
});

$('patron').onclick=()=>{
 regenerate();
 if(state.energy<2){
  toast('Недостатньо енергії!');
  return;
 }
 state.energy-=2;
 state.coins+=state.level;
 state.last=Date.now();
 save();
 draw();
 $('gameMessage').textContent='+'+state.level+' монет!';
};

$('upgrade').onclick=()=>{
 const cost=upgradeCost();
 if(state.coins<cost){
  toast('Недостатньо монет!');
  return;
 }
 state.coins-=cost;
 state.level++;
 save();
 draw();
 $('gameMessage').textContent=
  'Рівень '+state.level+'! Тепер +'+state.level+' за клік.';
};

window.addEventListener('cloud-loading',()=>{
 loadingCloud=true;
});

window.addEventListener('cloud-load',event=>{
 const d=event.detail;
 if(!d)return;
 state={
  coins:d.coins,
  level:d.level,
  energy:d.energy,
  last:d.last||Date.now()
 };
 normalize();
 energyCarry=0;
 regenerate();
 draw();
 try{
  localStorage.setItem(key,JSON.stringify(state));
 }catch(e){}
 loadingCloud=false;
});

window.addEventListener('cloud-ready',()=>{
 loadingCloud=false;
});

window.addEventListener('pagehide',()=>{
 try{
  localStorage.setItem(key,JSON.stringify(state));
 }catch(e){}
});

regenerate();
draw();
setInterval(regenerate,250);

})();
</script>

<script type="module">
import {initializeApp}
from 'https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js';

import {
 getAuth,
 GoogleAuthProvider,
 signInWithPopup,
 signOut,
 onAuthStateChanged
}
from 'https://www.gstatic.com/firebasejs/11.10.0/firebase-auth.js';

import {
 getFirestore,
 doc,
 getDoc,
 setDoc,
 runTransaction
}
from 'https://www.gstatic.com/firebasejs/11.10.0/firebase-firestore.js';

const firebaseConfig={
 apiKey:'AIzaSyAvWb2Av6XYUWN_FyVcFZjY7qCIf-EQBdg',
 authDomain:'potuzhnyi-simulator.firebaseapp.com',
 projectId:'potuzhnyi-simulator',
 storageBucket:'potuzhnyi-simulator.firebasestorage.app',
 messagingSenderId:'22853697098',
 appId:'1:22853697098:web:a4898d06f77afb9d66b0b3'
};

const $=id=>document.getElementById(id);
const app=initializeApp(firebaseConfig);
const auth=getAuth(app);
const db=getFirestore(app);
const localKey='potuzhnyi_clicker_v4';

let currentUser=null;
let cloudReady=false;
let pendingSave=null;
let saveTimer=null;
let sessionId=0;
let loginBusy=false;
let nickname='ГІСТЬ';
let playerId='';

const status=t=>{
 $('profileStatus').textContent=t;
};

function getLocal(){
 try{
  return JSON.parse(localStorage.getItem(localKey)||'{}');
 }catch(e){
  return {};
 }
}

function valid(d){
 return d&&
  Number.isFinite(d.coins)&&
  Number.isFinite(d.level)&&
  Number.isFinite(d.energy);
}

function cleanName(value){
 return Array.from(value.trim()).slice(0,16).join('');
}

function renderProfile(){
 $('profileName').textContent=nickname;
 $('profileId').textContent=playerId?'ID: '+playerId:'';
}

function randomId(){
 const chars='ABCDEFGHIJKLMNOPQRSTUVWXYZ';
 const digits='0123456789';
 const arr=[];
 const bytes=new Uint32Array(8);

 crypto.getRandomValues(bytes);

 for(let i=0;i<4;i++){
  arr.push(chars[bytes[i]%26]);
 }

 for(let i=4;i<8;i++){
  arr.push(digits[bytes[i]%10]);
 }

 for(let i=7;i>0;i--){
  const j=crypto.getRandomValues(new Uint32Array(1))[0]%(i+1);
  [arr[i],arr[j]]=[arr[j],arr[i]];
 }

 return arr.join('');
}

async function ensurePlayerId(uid){
 const playerRef=doc(db,'players',uid);

 for(let attempt=0;attempt<12;attempt++){
  const candidate=randomId();
  const idRef=doc(db,'playerIds',candidate);

  const found=await runTransaction(db,async tx=>{
   const player=await tx.get(playerRef);

   if(player.exists()&&player.data().playerId){
    return player.data().playerId;
   }

   const taken=await tx.get(idRef);
   if(taken.exists())return null;

   tx.set(idRef,{uid});
   tx.set(playerRef,{playerId:candidate},{merge:true});

   return candidate;
  });

  if(found)return found;
 }

 throw new Error('Не вдалося створити унікальний ID');
}

async function flushSave(){
 if(!currentUser||!cloudReady||!pendingSave)return;

 const uid=currentUser.uid;
 const data=pendingSave;
 pendingSave=null;

 try{
  await setDoc(doc(db,'players',uid),data,{merge:true});

  if(currentUser?.uid===uid){
   status('☁️ Прогрес збережено');
  }
 }catch(error){
  if(currentUser?.uid===uid){
   pendingSave=data;
   status('Помилка збереження: '+(error.code||error.message));
  }
 }
}

window.addEventListener('game-save',event=>{
 if(!currentUser||!cloudReady)return;

 pendingSave={
  ...event.detail,
  updatedAt:Date.now()
 };

 clearTimeout(saveTimer);
 saveTimer=setTimeout(flushSave,1000);
});

document.addEventListener('visibilitychange',()=>{
 if(document.visibilityState==='hidden'){
  clearTimeout(saveTimer);
  flushSave();
 }
});

/* РЕДАГУВАННЯ НІКА */
$('editName').onclick=()=>{
 $('nameEditor').hidden=false;
 $('nicknameInput').value=nickname==='ГІСТЬ'?'':nickname;
 $('nicknameInput').focus();
};

$('cancelName').onclick=()=>{
 $('nameEditor').hidden=true;
};

$('saveName').onclick=async()=>{
 const value=cleanName($('nicknameInput').value);

 if(!value){
  status('Введи нік');
  return;
 }

 if(Array.from($('nicknameInput').value.trim()).length>16){
  status('Максимум 16 символів');
  return;
 }

 if(currentUser&&!cloudReady){
  status('Дочекайся завантаження профілю');
  return;
 }

 const old=nickname;
 nickname=value;
 renderProfile();
 $('nameEditor').hidden=true;

 if(currentUser){
  try{
   await setDoc(
    doc(db,'players',currentUser.uid),
    {nickname:value},
    {merge:true}
   );
   status('☁️ Нік збережено');
  }catch(e){
   nickname=old;
   renderProfile();
   status('Помилка збереження ніка: '+(e.code||e.message));
  }
 }else{
  localStorage.setItem('potuzhnyi_guest_nickname',value);
  status('Нік збережено на цьому пристрої');
 }
};

/* GOOGLE-ВХІД */
async function login(){
 if(loginBusy)return;

 loginBusy=true;
 $('googleLogin').disabled=true;
 status('Відкриваємо Google…');

 try{
  const provider=new GoogleAuthProvider();
  provider.setCustomParameters({
   prompt:'select_account'
  });

  await signInWithPopup(auth,provider);
 }catch(e){
  status('Помилка входу: '+(e.code||e.message));
 }finally{
  loginBusy=false;
  $('googleLogin').disabled=false;
 }
}

$('googleLogin').onclick=login;

$('googleLogout').onclick=async()=>{
 await flushSave();
 await signOut(auth);
};

/* СИНХРОНІЗАЦІЯ ПРОФІЛЮ */
onAuthStateChanged(auth,async user=>{
 const session=++sessionId;

 currentUser=user;
 cloudReady=false;
 pendingSave=null;
 clearTimeout(saveTimer);

 $('nameEditor').hidden=true;
 $('googleLogin').hidden=!!user;
 $('googleLogout').hidden=!user;

 if(!user){
  nickname=localStorage.getItem('potuzhnyi_guest_nickname')||'ГІСТЬ';
  playerId='';
  renderProfile();

  $('profileDescription').textContent=
   'Увійди через Google, щоб зберігати прогрес.';

  status('Гостьовий режим');
  return;
 }

 nickname='ГРАВЕЦЬ';
 playerId='';
 renderProfile();

 $('profileDescription').textContent=
  'Твій прогрес зберігається через Google.';

 status('☁️ Завантажуємо профіль…');
 window.dispatchEvent(new Event('cloud-loading'));

 try{
  const playerRef=doc(db,'players',user.uid);
  const playerDoc=await getDoc(playerRef);

  if(session!==sessionId)return;

  let data;

  if(playerDoc.exists()&&valid(playerDoc.data())){
   data=playerDoc.data();
  }else{
   const local=getLocal();
   const previous=localStorage.getItem('potuzhnyi_last_account');

   data=(!previous&&valid(local))
    ?local
    :{
      coins:0,
      level:1,
      energy:100,
      last:Date.now()
     };

   await setDoc(playerRef,{
    coins:data.coins,
    level:data.level,
    energy:data.energy,
    last:data.last,
    updatedAt:Date.now()
   },{merge:true});
  }

  if(session!==sessionId)return;

  playerId=await ensurePlayerId(user.uid);

  if(session!==sessionId)return;

  const updated=await getDoc(playerRef);

  if(session!==sessionId)return;

  nickname=cleanName(
   updated.data()?.nickname||
   user.displayName||
   'ГРАВЕЦЬ'
  )||'ГРАВЕЦЬ';

  renderProfile();

  window.dispatchEvent(new CustomEvent('cloud-load',{
   detail:data
  }));

  localStorage.setItem('potuzhnyi_last_account',user.uid);

  cloudReady=true;
  status('☁️ Профіль синхронізовано');

 }catch(error){
  if(session===sessionId){
   status('Помилка Firebase: '+(error.code||error.message));
   window.dispatchEvent(new Event('cloud-ready'));
  }
 }
});
</script>
